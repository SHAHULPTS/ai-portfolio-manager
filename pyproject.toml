[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-portfolio-manager"
version = "0.0.1"
description = "Ask questions about a stock portfolio in plain English: a LangGraph agent with guarded text-to-SQL and tested metric formulas."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Dependencies are added in the phase that first needs them, so each phase's PR shows why.
dependencies = [
    "python-dotenv>=1.0",
    # phase 1: data loading
    "duckdb>=1.1",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools]
py-modules = ["config"]
packages = ["db", "etl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
