# --- data lookups -------------------------------------------------------------------------
- id: d01-wipro-trades
  manager: 2
  question: List my trades in WIPRO during 2025.
  intents: [data_lookup]
  sql: |
    SELECT portfolio_id, trade_date, side, quantity, price FROM analytics.v_transactions
    WHERE symbol = 'WIPRO' AND trade_date BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'

- id: d02-trade-counts
  manager: 1
  question: How many trades has each of my portfolios made in total?
  intents: [data_lookup]
  sql: SELECT portfolio_id, count(*) FROM analytics.v_transactions GROUP BY portfolio_id

- id: d03-deposits
  manager: 3
  question: Show all deposits into my infrastructure portfolio.
  intents: [data_lookup]
  sql: |
    SELECT date, amount FROM analytics.v_cash_flows
    WHERE portfolio_id = 302 AND type = 'DEPOSIT'

- id: d04-price-on-date
  manager: 1
  question: What did HDFCBANK close at on 2024-12-31?
  intents: [data_lookup]
  sql: SELECT close FROM analytics.v_prices WHERE symbol = 'HDFCBANK' AND date = DATE '2024-12-31'

- id: d05-shared-stocks
  manager: 2
  question: Which stocks do I hold in more than one portfolio?
  intents: [data_lookup]
  sql: |
    SELECT symbol FROM analytics.v_positions GROUP BY symbol
    HAVING count(DISTINCT portfolio_id) > 1

- id: d06-nav-on-date
  manager: 3
  question: What was the NAV of my PSU fund at the end of 2022?
  intents: [data_lookup, metric]
  sql: |
    SELECT nav FROM analytics.v_portfolio_nav
    WHERE portfolio_id = 301 AND date <= DATE '2022-12-31' ORDER BY date DESC LIMIT 1

- id: d07-fees
  manager: 1
  question: How much have I paid in trading fees in total, per portfolio?
  intents: [data_lookup]
  sql: SELECT portfolio_id, sum(fees) FROM analytics.v_transactions GROUP BY portfolio_id

- id: d08-first-buy
  manager: 2
  question: When did I first buy ETERNAL, and in which portfolio?
  intents: [data_lookup]
  sql: |
    SELECT portfolio_id, min(trade_date) FROM analytics.v_transactions
    WHERE symbol = 'ETERNAL' AND side = 'BUY' GROUP BY portfolio_id

- id: d09-power-holdings
  manager: 3
  question: List my current holdings in the Power sector with their market value.
  intents: [data_lookup, metric]
  sql: |
    SELECT portfolio_id, symbol, market_value FROM analytics.v_positions
    WHERE sector = 'Power'

- id: d10-largest-withdrawal
  manager: 1
  question: What's the largest single withdrawal I've made?
  intents: [data_lookup]
  sql: |
    SELECT portfolio_id, date, amount FROM analytics.v_cash_flows
    WHERE type = 'WITHDRAWAL' ORDER BY amount ASC LIMIT 1

- id: d11-realized-losses
  manager: 2
  question: Which stocks have I sold at a loss overall, by realised P&L?
  intents: [data_lookup, metric]
  # "Overall" is ambiguous: per portfolio, or summed across portfolios. The first eval run
  # failed this case because the agent summed (and said so in its answer); both readings
  # are accepted now. See DESIGN_NOTES.md, phase 7.
  sql:
    - |
      SELECT portfolio_id, symbol, realized_pnl FROM analytics.v_realized_pnl
      WHERE realized_pnl < 0
    - |
      SELECT symbol, sum(realized_pnl) FROM analytics.v_realized_pnl
      GROUP BY symbol HAVING sum(realized_pnl) < 0

- id: d12-shares-held
  manager: 3
  question: How many shares of NTPC do I hold?
  intents: [data_lookup]
  sql: SELECT portfolio_id, quantity FROM analytics.v_positions WHERE symbol = 'NTPC'

# --- metric and data together -------------------------------------------------------------
- id: b01-sharpe-and-trades
  manager: 2
  question: What's the Sharpe ratio of my tech fund over 3 years, and which trades did I make in it in 2026?
  intents: [both]
  metrics: [sharpe_ratio]
  portfolios: [201]
  period: 3y
  sql: |
    SELECT trade_date, symbol, side, quantity FROM analytics.v_transactions
    WHERE portfolio_id = 201 AND trade_date >= DATE '2026-01-01'

- id: b02-return-and-trades
  manager: 1
  question: What was Asha Core Equity's total return in 2025, and list its trades in January 2026.
  intents: [both]
  metrics: [total_return]
  portfolios: [102]
  period: custom
  start: "2025-01-01"
  end: "2025-12-31"
  sql: |
    SELECT trade_date, symbol, side, quantity FROM analytics.v_transactions
    WHERE portfolio_id = 102 AND trade_date BETWEEN DATE '2026-01-01' AND DATE '2026-01-31'

