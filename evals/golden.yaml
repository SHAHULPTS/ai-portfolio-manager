# Golden questions for the agent. Managers: 1 Asha (101 Financials, 102 Core Equity),
# 2 Ravi (201 Tech, 202 Defensive, 203 Consumer Trends), 3 Priya (301 PSU & Energy,
# 302 Infrastructure). Data ends 2026-04-08.
#
# Fields:
#   intents: accepted intents (any one passes)
#   reason: required out_of_scope_reason
#   metrics: required metric names (all must be chosen); any_metric: at least one of these
#   portfolios: required portfolio_ids ([] = all of the manager's portfolios)
#   period / start / end: required period
#   sql: a correct query; the agent's rows must contain the same values (column names ignored)
#   turns: earlier questions in the same conversation (follow-up cases)

# --- metric questions ---------------------------------------------------------------------
- id: m01-cagr
  manager: 1
  question: What's the CAGR of my financials fund since inception?
  intents: [metric]
  metrics: [cagr]
  portfolios: [101]
  period: since_inception

